metadata:
  time-of-day:
    icon: material/schedule
    hide_from_ui: true
    strip_from_tracks: true
  weekday:
    icon: material/event
    hide_from_ui: true
    strip_from_tracks: true
  month:
    icon: material/calendar_month
    hide_from_ui: true
    strip_from_tracks: true
  #######
  artist:
    icon: material/artist # material/album material/art_track
    hide_from_ui: true
    strip_from_tracks: true
  country:
    icon: material/globe # material/globe_location_pin
    hide_from_ui: true
    strip_from_tracks: true
  city:
    icon: material/location_city
    hide_from_ui: true
    strip_from_tracks: true
  events:
    icon: material/celebration
    hide_from_ui: true
    strip_from_tracks: true
  events-misc:
    icon: material/celebration
    hide_from_ui: true
    strip_from_tracks: true
  #######
  context:
    icon: material/contextual_token
    color: "#ffa421" # Orange [lightTheme.orangeColor]
  level:
    icon: material/android_cell_5_bar
    color: "#0068c9" # Dark Blue [blue80]
  dance:
    icon: material/music_note # material/palette material/brush material/format_paint
  #######
  seasonal:
    selector_title: Theme
    icon: material/local_florist
    hide_from_selector:
      - autumn
      - new year's eve
      - spring
      - winter
  playlist:
    icon: material/queue_music
    strip_from_tracks:
      - ordered
      - ordered by bpm
      - ordered by danceability
      - ordered by duration
      - ordered by energy
      ###
      - spotify stuff
      - default name
      - playlist in a bottle
      - specific
      - backup
      - mondaymix
      - setlist
  misc:
    icon: material/tab_unselected
    strip_from_tracks: true
  miscx:
    icon: material/tab_unselected
    strip_from_tracks: true
  #######
  language:
    comment: "**Note:** The `language:` tags are extracted from playlist titles, and do not necessarily correspond to the actual language(s) of the songs."
    icon: material/translate # material/language
  genre:
    icon: material/genres
    color: "#803df5" # Violet [lightTheme.violetColor]
  epoch:
    comment: "**Note:** The `epoch:` tags are extracted from playlist titles, and do not necessarily correspond to the actual release dates of the songs."
    icon: material/hourglass_bottom
    color: "#00c0f2" # Turqouise
  mood:
    icon: material/comedy_mask # material/theater_comedy
    color: "#29b09d" # Blue-Green [blueGreen80]
  structure:
    selector_title: Musical Structure
    icon: material/align_justify_space_even
    color: "#ffabab" # Light Red [red40]
  tempo:
    icon: material/speed
  timing:
    icon: material/timer
  topic:
    icon: material/label
    color: "#ffabab" # Light Red [red40]
limits:
  seasonal:
    christmas:
      min_playlist_count: 1
      min_playlist_percent: 20.0
